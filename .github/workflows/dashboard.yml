name: Workflow

on:
  push:
    branches:
    - main
  workflow_dispatch:

permissions:
  contents: write  # to push the workflow_testing_indicator branch

concurrency:
  # a newer run cancels an older one, so a stale run cannot overwrite the dashboard
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execute_notebooks_and_publish_dashboard:
    runs-on: ubuntu-latest
    steps:
    - name: Clone the repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      with:
        # don't leave the token in .git/config, where the notebooks run; the publish step gets its own
        persist-credentials: false

    - name: Set up Python 3.10.12
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
      with:
        # Change this based on the python version in Google colab
        python-version: '3.10.12'

    - name: Install system packages (LaTeX for notebooks that latexify, graphviz)
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          graphviz texlive-latex-base texlive-latex-extra texlive-fonts-recommended cm-super dvipng

    - name: Install pinned Python packages (see REPRODUCE.md)
      run: |
        # CPU-only PyTorch; the default Linux wheels bundle large CUDA libraries
        pip install --no-cache-dir torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu | cat
        pip install --no-cache-dir -r requirements-local.txt | cat
        # minepy (MIC_correlation_2d) is source-only and its setup.py needs pkg_resources:
        # build it with the pinned setuptools<81 instead of pip's isolated (newest) setuptools
        pip install --no-cache-dir --no-build-isolation minepy==1.2.6 | cat
        # one-line fixes to installed distrax and causalgraphicalmodels (REPRODUCE.md 4.27)
        python scripts/patch_packages.py

    - name: Cache datasets
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
      with:
        path: |
          ~/.keras/datasets
          ~/data
          ~/tensorflow_datasets
        key: datasets-v3  # bump when notebooks download new datasets, so they get cached

    - name: Pre-download slow or broken datasets (see REPRODUCE.md 2.6)
      run: |
        mkdir -p ~/.keras/datasets ~/data/EMNIST/raw

        # CIFAR-10 for cifar_viz_tf: Hugging Face mirror, the original server is very slow
        f=~/.keras/datasets/cifar-10-batches-py.tar.gz
        [ -f "$f" ] || curl -L --fail --retry 5 -sS -o "$f" \
          https://huggingface.co/cloneofsimo/test_model/resolve/main/cifar-10-python.tar.gz
        echo "6d958be074577803d12ecdefd02955f39262c83c16fe9348329d7fe0b5c001ce  $f" | sha256sum -c

        # EMNIST for emnist_viz_jax: torchvision 0.16's URL no longer serves the file
        f=~/data/EMNIST/raw/gzip.zip
        [ -f "$f" ] || curl -L --fail --retry 5 -sS -o "$f" \
          https://biometrics.nist.gov/cs_links/EMNIST/gzip.zip
        echo "fb9bb67e33772a9cc0b895e4ecf36d2cf35be8b709693c3564cea2a019fcda8e  $f" | sha256sum -c

    - name: Make hardcoded absolute paths writable (see REPRODUCE.md 4.16, 4.17)
      run: |
        # Upstream CI runs as root, so these notebooks can write anywhere; the runner user cannot.
        # (linreg_poly_vs_degree's FIG_DIR=/teamspace/... is edited to "figures" in the notebook)
        # gaussEvec, seq_logo_demo, ...: FIG_DIR=/Users/kpmurphy/github/bookv2/figures
        sudo mkdir -p /Users/kpmurphy/github/bookv2/figures && sudo chown -R "$USER" /Users
        # (pcaImageDemo's savefig("/PcaTrainFaceImages.png") is redirected by tests/test_notebooks.py)

    - name: Execute notebooks
      continue-on-error: true  # failures are shown as red marks on the dashboard
      run: |
        pytest -n auto -s --verbose tests/test_notebooks.py

    - name: Create dashboard
      env:
        # passed through env, not ${{ }} in the script, so a branch name can't inject shell code
        REPO: ${{ github.repository }}
        BRANCH: ${{ github.ref_name }}
      run: |
        mkdir -p workflow_testing_indicator
        cp -r test_results/. workflow_testing_indicator/ 2>/dev/null || true
        python scripts/create_figure_dashboard.py --user_name "$REPO" --branch "$BRANCH"

    - name: Push test-results to workflow_testing_indicator
      uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: workflow_testing_indicator/
        publish_branch: workflow_testing_indicator
